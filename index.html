<!DOCTYPE html>
<!--
  코코백업 — 코코포리아 로그 간단 백업
  · 스타일 HTML(코코포리아 내보내기)의 CSS와 로그 JSON의 메시지를 합쳐
    한 파일짜리 HTML 로그를 만든다.
  · 화면 모양은 style.css, 동작은 app.js에 있다.
  · id가 붙은 요소는 app.js가 찾아서 쓰므로, id를 바꾸면 app.js의 el 목록도 같이 바꿔야 한다.
-->
<html lang="ko-KR">
<head>
  <meta charset="UTF-8" />
  <!-- 모바일에서 화면 폭에 맞춰 보이게 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 브라우저 기본 UI(스크롤바 등)를 어두운 테마로. CSS보다 먼저 읽혀서 처음 깜빡임이 흰색으로 번쩍이지 않음 -->
  <meta name="color-scheme" content="dark" />
  <title>코코백업</title>
  <!-- 사이트 글꼴을 CSS보다 먼저 받기 시작해서 글꼴이 바뀌며 화면이 깜빡이는 시간을 줄인다.
       주소는 style.css의 @font-face와 정확히 같아야 한다 (다르면 두 번 받음).
       글꼴 preload에는 crossorigin이 꼭 필요하다. -->
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/2412-1@1.0/Ownglyph_corncorn-Rg.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <!-- defer: HTML을 다 읽은 뒤에 실행된다. 그래서 head에 있어도 아래 요소들을 찾을 수 있고,
       스크립트를 받는 동안 화면 그리기가 멈추지 않는다. -->
  <script src="app.js" defer></script>
</head>
<body>
  <!-- ── 상단바 ── -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">COCOBACKUP</span>
      <span class="brand-sub">코코포리아 로그 간단 백업</span>
    </div>
    <p class="topbar-note">해당 사이트는 깃허브페이지를 이용하여 배포된 HTML+CSS+JS 사이트입니다.<br>따라서 별도의 서버를 두고 있지 않으며, 파일은 어디에도 업로드되지 않습니다.</p>
  </header>

  <div class="layout">
    <!-- ── 왼쪽: 설정 패널 (01 ~ 05 단계 + 다운로드) ── -->
    <aside class="panel">
      <!-- 01 스타일 HTML
           <label> 안에 파일 입력칸을 넣어서, 구역 어디를 눌러도 파일 선택창이 뜬다.
           .drop-main / .drop-meta 글자는 파일을 올리면 app.js가 바꿔 쓴다. -->
      <section class="step">
        <h2 class="step-title"><span class="step-no">01</span>스타일 HTML</h2>
        <label class="drop" id="drop-html">
          <input type="file" id="file-html" accept=".html,.htm,text/html" />
          <span class="drop-main">HTML 파일</span>
          <span class="drop-meta" id="meta-html">CSS와 스탠딩 이미지들을 가져오기 위한 참고용 HTML 파일입니다. 모든 이미지를 읽어오기 위해 Main 탭의 파일을 올리는 것을 권장합니다.</span>
        </label>
      </section>

      <!-- 02 로그 JSON
           application/octet-stream: 일부 환경에서 JSON 파일 형식이 이렇게 잡혀서 선택이 안 되는 것을 막음 -->
      <section class="step">
        <h2 class="step-title"><span class="step-no">02</span>로그 JSON</h2>
        <label class="drop" id="drop-json">
          <input type="file" id="file-json" accept=".json,application/json,application/octet-stream" />
          <span class="drop-main">JSON 파일</span>
          <span class="drop-meta" id="meta-json">JSON 파일에서 채팅 내역과 채널 목록을 읽어옵니다.</span>
        </label>
      </section>

      <!-- 03 채널 선택
           목록(<ul id="channels">)은 JSON을 올리면 app.js가 채워 넣는다. -->
      <section class="step">
        <div class="step-head">
          <h2 class="step-title"><span class="step-no">03</span>채널</h2>
          <div class="step-actions">
            <button type="button" class="link-btn" id="sel-all" disabled>전체</button>
            <button type="button" class="link-btn" id="sel-none" disabled>해제</button>
          </div>
        </div>
        <ul class="channels" id="channels">
          <li class="channels-empty">JSON을 올리면 채널이 여기 나타납니다.</li>
        </ul>
        <p class="hint">main은 왼쪽, 나머지 채널은 오른쪽으로 정렬됩니다.</p>
      </section>

      <!-- 04 글꼴
           선택칸 항목은 app.js의 FONT_LIBRARY로 만들어진다.
           .select-wrap은 직접 그린 화살표(::after)를 붙이기 위한 껍데기. -->
      <section class="step">
        <h2 class="step-title"><span class="step-no">04</span>글꼴</h2>
        <div class="select-wrap font-select">
          <select class="select" id="font"></select>
        </div>
        <label class="drop drop-sm" id="drop-font">
          <!-- multiple: 글꼴 파일 여러 개를 한 번에 올릴 수 있음 -->
          <input type="file" id="file-font" accept=".woff2,.woff,.ttf,.otf" multiple />
          <span class="drop-main">글꼴 파일 업로드</span>
          <span class="drop-meta" id="meta-font">woff2 · woff · ttf · otf 파일을 지원합니다.<br>결과 파일 안에 함께 저장됩니다.</span>
        </label>
      </section>

      <!-- 05 제목: 결과 HTML의 제목이자 다운로드 파일 이름. 비워 두면 원본 HTML 제목을 쓴다. -->
      <section class="step">
        <h2 class="step-title"><span class="step-no">05</span>제목</h2>
        <input type="text" class="text-input" id="title" placeholder="로그 제목" />
      </section>

      <!-- 다운로드 버튼 + 상태 문구 (HTML과 JSON이 모두 올라와야 버튼이 켜짐) -->
      <div class="export">
        <button type="button" class="primary" id="download" disabled>HTML 다운로드</button>
        <p class="status" id="status">파일이 전부 올라가 있지 않으면 작동하지 않습니다.</p>
      </div>
    </aside>

    <!-- ── 오른쪽: 미리보기 ──
         결과 HTML을 iframe에 띄운다. iframe 안은 별도 문서라서
         원본 로그의 CSS가 이 사이트 화면에 섞이지 않는다. -->
    <main class="preview">
      <div class="preview-bar">
        <span class="preview-label">미리보기</span>
        <span class="preview-count" id="count">—</span>
      </div>
      <div class="preview-frame">
        <iframe id="frame" title="미리보기"></iframe>
        <!-- 파일이 다 올라오기 전까지 iframe 위를 덮는 안내 화면 -->
        <div class="preview-empty" id="empty">
          <span class="empty-big">01 + 02</span>
          <span>HTML과 JSON을 모두 올리면 결과가 여기 보입니다.</span>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
